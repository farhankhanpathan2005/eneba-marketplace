version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eneba-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    container_name: eneba-backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
      POSTGRES_SSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
    container_name: eneba-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
